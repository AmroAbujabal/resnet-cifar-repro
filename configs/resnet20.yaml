# ResNet-20 (n=3, 6n+2=20 layers, ~0.27M params). Paper Table 6 error: 8.75%.
name: resnet20
n: 3

# optimizer / schedule (He et al. 2015, Sec 4.2)
optimizer: sgd
momentum: 0.9
weight_decay: 1.0e-4      # applied to all params (confirmed decision)
weight_decay_on_bn: true
batch_size: 128
lr: 0.1
lr_milestones_iters: [32000, 48000]
lr_gamma: 0.1
max_iters: 64000
warmup: false             # only ResNet-110 warms up

# data (confirmed decisions)
train_split: 50000        # final models train on full 50k
val_split: 5000           # 45k/5k only used to tune schedule
color_aug: false          # pad+crop+flip only, no color aug
downsample: option_a      # strided subsample + channel zero-pad

seeds: [0, 1, 2]
