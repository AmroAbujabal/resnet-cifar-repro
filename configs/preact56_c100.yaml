# Phase 3 cell: pre-activation ResNet-56 on CIFAR-100.
# Everything below is copied from resnet56.yaml and held FIXED -- only
# name / dataset / num_classes / preact vary across the 2x2 matrix.
name: preact56_c100
n: 9
dataset: cifar100
num_classes: 100
preact: true

optimizer: sgd
momentum: 0.9
weight_decay: 1.0e-4
weight_decay_on_bn: true
batch_size: 128
lr: 0.1
lr_milestones_iters: [32000, 48000]
lr_gamma: 0.1
max_iters: 64000
warmup: false

train_split: 50000
val_split: 5000
color_aug: false
downsample: option_a

seeds: [0, 1, 2]
