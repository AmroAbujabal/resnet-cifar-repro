# Phase 4: original ResNet-56 on CIFAR-10, rerun under the deterministic setup with
# per-interval logging, to put a train-error curve behind the seed 2 excursion.
#
# Identical to resnet56.yaml except for `name`. The name differs on purpose: appending
# a second (resnet56, 2) row would collide with the three runs the reproduction claim
# was pre-registered on, and build_site.py stops on that duplicate. This row is a new
# measurement of the same cell, not a fourth seed of it -- the Phase 2 mean, s.d. and
# Table 1 keep meaning exactly what they meant.
name: resnet56_rerun
n: 9
dataset: cifar10
num_classes: 10
preact: false

optimizer: sgd
momentum: 0.9
weight_decay: 1.0e-4
weight_decay_on_bn: true
batch_size: 128
lr: 0.1
lr_milestones_iters: [32000, 48000]
lr_gamma: 0.1
max_iters: 64000
warmup: false

train_split: 50000
val_split: 5000
color_aug: false
downsample: option_a

seeds: [2]
